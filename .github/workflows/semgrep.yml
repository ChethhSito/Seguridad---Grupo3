name: Semgrep CE
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  scan:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Escanear el laboratorio con reglas comunitarias
        run: semgrep scan --config auto app.py
      - name: Comprobar reglas del proyecto
        run: python scripts/verificar_hallazgos.py
      - name: Bloquear regresiones en el codigo corregido
        run: semgrep scan --config reglas.yml --error --metrics=off muestras/referencias_seguras.py muestras/dependencias-seguras.txt
      - name: Comprobar la muestra generada por IA
        run: python scripts/verificar_muestra_ia.py

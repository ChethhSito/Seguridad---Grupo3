rules:
  - id: laboratorio-sql-fstring
    message: "A03 Injection. Consulta SQL construida con f-string: usa parametros de sqlite3."
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 Injection"
    pattern: $DB.execute(f"...")

  - id: laboratorio-html-markup-fstring
    message: "A03 Injection. HTML marcado como seguro con datos interpolados: usa autoescape de Jinja."
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-79: Cross-site Scripting"
      owasp: "A03:2021 Injection"
    pattern: Markup(f"...")

  - id: laboratorio-hash-md5
    message: "A02 Cryptographic Failures. Hash MD5: usa SHA-256."
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: "A02:2021 Cryptographic Failures"
    pattern: hashlib.md5(...)

  - id: laboratorio-password-fijo
    message: "A07 Identification and Authentication Failures. Contrasena fija en el codigo: leela desde el entorno."
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 Identification and Authentication Failures"
    pattern: password = "..."

  - id: laboratorio-debug-flask
    message: "A05 Security Misconfiguration. Flask arranca con debug activo."
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-489: Active Debug Code"
      owasp: "A05:2021 Security Misconfiguration"
    pattern-either:
      - pattern: $APP.run(debug=True)
      - pattern: $APP.run(..., debug=True)
      - pattern: $APP.run(debug=True, ...)
      - pattern: $APP.run(..., debug=True, ...)

  - id: laboratorio-pickle
    message: "A08 Software and Data Integrity Failures. pickle.loads ejecuta datos no confiables: usa JSON."
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 Software and Data Integrity Failures"
    pattern: pickle.loads(...)

  - id: laboratorio-log-credencial
    message: "A09 Security Logging and Monitoring Failures. Una contrasena queda escrita en el registro."
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      owasp: "A09:2021 Security Logging and Monitoring Failures"
    pattern: logging.info("...", password)

  - id: laboratorio-acceso-por-parametro
    message: "A01 Broken Access Control. El id de la peticion elige el registro sin comprobar el dueno."
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-639: Authorization Bypass Through User-Controlled Key"
      owasp: "A01:2021 Broken Access Control"
    pattern: $DATOS[request.args.get("id")]

  - id: laboratorio-assert-autorizacion
    message: "A04 Insecure Design. assert no debe decidir una autorizacion: desaparece al optimizar Python."
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-617: Reachable Assertion"
      owasp: "A04:2021 Insecure Design"
    pattern: assert es_admin

  - id: laboratorio-urlopen-destino
    message: "A10 Server-Side Request Forgery. urlopen recibe un destino arbitrario: usa una lista cerrada."
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery"
      owasp: "A10:2021 Server-Side Request Forgery"
    pattern: urlopen(...)

  - id: laboratorio-dependencia-antigua
    message: "A06 Vulnerable and Outdated Components. Version fijada solo como muestra. No instalar este archivo."
    languages: [generic]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-1104: Use of Unmaintained Third Party Components"
      owasp: "A06:2021 Vulnerable and Outdated Components"
    paths:
      include:
        - muestras/dependencias-ia.txt
    pattern: PyYAML==5.3.1
